<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07150e"/>
      <stop offset="50%" stop-color="#0b2417"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glowHack" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgHack)"/>

  <!-- Technical Grid -->
  <g opacity="0.08" stroke="#22c55e" stroke-width="1.5">
    <path d="M0,180 H1920 M0,360 H1920 M0,540 H1920 M0,720 H1920 M0,900 H1920"/>
    <path d="M240,0 V1080 M480,0 V1080 M720,0 V1080 M960,0 V1080 M1200,0 V1080 M1440,0 V1080 M1680,0 V1080"/>
  </g>

  <!-- Header Badge -->
  <rect x="120" y="90" width="410" height="48" rx="24" fill="#15803d" opacity="0.3"/>
  <rect x="120" y="90" width="410" height="48" rx="24" fill="none" stroke="#22c55e" stroke-width="2"/>
  <text x="325" y="122" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#86efac" text-anchor="middle">DAY 2 · FINALE &amp; SHOWCASE</text>

  <!-- Main Title -->
  <text x="120" y="210" font-family="'Outfit', sans-serif" font-size="64" font-weight="800" fill="#ffffff">Speed-Wire Diagnostics &amp; Certification</text>
  <text x="120" y="260" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" fill="#bbf7d0">Reverse-Engineering Relay, Open Invention Hackathon &amp; Junior Robotics Engineer Award</text>

  <!-- Canvas Box -->
  <rect x="220" y="340" width="1480" height="580" rx="24" fill="#0f1f17" stroke="#166534" stroke-width="3"/>

  <!-- Graphic: Diagnostics & Certification -->
  <g transform="translate(640, 580)">
    <!-- Certificate Board Base -->
    <rect x="-300" y="-180" width="380" height="260" rx="16" fill="#1e293b" stroke="#22c55e" stroke-width="3"/>
    <rect x="-280" y="-160" width="340" height="220" rx="10" fill="#020617"/>
    <text x="-110" y="-115" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" fill="#22c55e" text-anchor="middle">OFFICIAL CREDENTIAL</text>
    <text x="-110" y="-80" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">JUNIOR ROBOTICS ENGINEER</text>
    <line x1="-250" y1="-50" x2="30" y2="-50" stroke="#334155" stroke-width="2"/>
    <text x="-110" y="-20" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Engr. Aamir Jamil · Miss Zia Ul Ain · Awais Paracha</text>
    <text x="-110" y="15" font-family="'JetBrains Mono', monospace" font-size="13" fill="#86efac" text-anchor="middle">CS TECHNOLOGIES ACADEMY</text>

    <!-- Trophy Emblem -->
    <g transform="translate(170, -60)">
      <circle cx="0" cy="0" r="75" fill="#14532d" stroke="#22c55e" stroke-width="4" filter="url(#glowHack)"/>
      <text x="0" y="25" font-size="64" text-anchor="middle">🏆</text>
    </g>

    <!-- Multimeter Diagnostics Probe -->
    <g transform="translate(-110, 140)">
      <rect x="-140" y="-15" width="280" height="45" rx="10" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">⚡ CONTINUITY PASSED: 100%</text>
    </g>
  </g>

  <!-- Explanatory Right Panel -->
  <g transform="translate(1200, 420)">
    <rect x="0" y="0" width="440" height="360" rx="16" fill="#143624" stroke="#166534" stroke-width="2"/>
    <text x="30" y="50" font-family="'Outfit', sans-serif" font-size="24" font-weight="700" fill="#86efac">SHOWCASE HIGHLIGHTS</text>
    
    <text x="30" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" fill="#bbf7d0">• Reverse-Engineer 3 instructor-faulted circuits</text>
    <text x="30" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" fill="#bbf7d0">• Open Team Hackathon (Craft your own invention)</text>
    <text x="30" y="185" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" fill="#bbf7d0">• 60-Second Student Engineer Project Pitches</text>
    <text x="30" y="225" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" fill="#bbf7d0">• Formal Assessment &amp; Troubleshooting Q&amp;A</text>
    <text x="30" y="265" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" fill="#bbf7d0">• Signed Certificate &amp; Hardware Kit Takeaway!</text>

    <rect x="30" y="295" width="380" height="45" rx="8" fill="#052e16" stroke="#22c55e"/>
    <text x="220" y="324" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#86efac" text-anchor="middle">GRADUATION &amp; TAKEAWAY KIT</text>
  </g>

  <!-- Bottom Spec Chips -->
  <rect x="220" y="830" width="340" height="50" rx="10" fill="#020617" stroke="#334155"/>
  <text x="390" y="862" font-family="'JetBrains Mono', monospace" font-size="16" fill="#86efac" text-anchor="middle">🔍 FAULT REVERSE-ENGINEERING</text>

  <rect x="590" y="830" width="360" height="50" rx="10" fill="#020617" stroke="#334155"/>
  <text x="770" y="862" font-family="'JetBrains Mono', monospace" font-size="16" fill="#22c55e" text-anchor="middle">🎯 CONCEPT: CIRCUIT DIAGNOSTICS</text>

  <rect x="980" y="830" width="340" height="50" rx="10" fill="#020617" stroke="#334155"/>
  <text x="1150" y="862" font-family="'JetBrains Mono', monospace" font-size="16" fill="#f59e0b" text-anchor="middle">⏱️ CEREMONY TIME: 50 MINS</text>

  <rect x="1350" y="830" width="350" height="50" rx="10" fill="#020617" stroke="#334155"/>
  <text x="1525" y="862" font-family="'JetBrains Mono', monospace" font-size="16" fill="#86efac" text-anchor="middle">🏅 JUNIOR ROBOTICS ENGINEER</text>
</svg>

