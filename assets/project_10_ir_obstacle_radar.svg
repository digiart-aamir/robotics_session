<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bg10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091316"/>
      <stop offset="50%" stop-color="#0d242a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glow10" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg10)"/>

  <!-- Technical Grid -->
  <g opacity="0.08" stroke="#14b8a6" stroke-width="1.5">
    <path d="M0,180 H1920 M0,360 H1920 M0,540 H1920 M0,720 H1920 M0,900 H1920"/>
    <path d="M240,0 V1080 M480,0 V1080 M720,0 V1080 M960,0 V1080 M1200,0 V1080 M1440,0 V1080 M1680,0 V1080"/>
  </g>

  <!-- Header Badge -->
  <rect x="120" y="90" width="380" height="48" rx="24" fill="#0f766e" opacity="0.3"/>
  <rect x="120" y="90" width="380" height="48" rx="24" fill="none" stroke="#14b8a6" stroke-width="2"/>
  <text x="310" y="122" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#2dd4bf" text-anchor="middle">DAY 2 · PROJECT 10 · SENSOR EXPANSION</text>

  <!-- Main Title -->
  <text x="120" y="210" font-family="'Outfit', sans-serif" font-size="64" font-weight="800" fill="#ffffff">Infrared (IR) Autonomous Obstacle Radar</text>
  <text x="120" y="260" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" fill="#cbd5e1">Active Optical Proximity Detection with Automatic Collision-Avoidance &amp; Warning Buzzer</text>

  <!-- Canvas Box -->
  <rect x="220" y="340" width="1480" height="580" rx="24" fill="#0f172a" stroke="#1e293b" stroke-width="3"/>

  <!-- Radar Ray Diagram -->
  <g transform="translate(480, 570)">
    <!-- Rover Front Nose -->
    <path d="M-80,-140 L0,-140 L40,-80 L40,80 L0,140 L-80,140 Z" fill="#1e293b" stroke="#334155" stroke-width="4"/>
    
    <!-- IR Sensor Module on Front -->
    <rect x="20" y="-60" width="70" height="120" rx="10" fill="#0f766e" stroke="#2dd4bf" stroke-width="3"/>
    
    <!-- IR Transmitter LED (Purple/Clear) -->
    <circle cx="90" cy="-30" r="16" fill="#c084fc" filter="url(#glow10)"/>
    <!-- IR Receiver Photodiode (Black/Dark) -->
    <circle cx="90" cy="30" r="16" fill="#020617" stroke="#2dd4bf" stroke-width="3"/>
    
    <!-- Emitted IR Beam Waves -->
    <path d="M115,-30 L380,-80" stroke="#c084fc" stroke-width="4" stroke-dasharray="10 6"/>
    <path d="M125,-30 L380,-30" stroke="#c084fc" stroke-width="4" stroke-dasharray="10 6"/>
    <path d="M115,-30 L380,20" stroke="#c084fc" stroke-width="4" stroke-dasharray="10 6"/>

    <!-- Reflected Beam Waves Returning -->
    <path d="M380,-30 L115,30" stroke="#2dd4bf" stroke-width="5" stroke-dasharray="8 4" filter="url(#glow10)"/>

    <!-- Detected Obstacle Wall -->
    <g transform="translate(430, 0)">
      <rect x="0" y="-180" width="45" height="360" rx="8" fill="#ef4444" stroke="#f87171" stroke-width="3"/>
      <text x="22" y="5" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle" transform="rotate(-90 22 5)">OBSTACLE BARRIER</text>
    </g>

    <text x="240" y="-105" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#c084fc">EMITTED 940nm IR PULSE</text>
    <text x="240" y="80" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#2dd4bf">REFLECTED BEAM (DETECTED)</text>
  </g>

  <!-- Explanatory Right Panel -->
  <g transform="translate(1180, 430)">
    <rect x="0" y="0" width="460" height="350" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="30" y="50" font-family="'Outfit', sans-serif" font-size="24" font-weight="700" fill="#2dd4bf">AUTONOMOUS BRAKING LOGIC</text>
    
    <text x="30" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" fill="#cbd5e1">• IR Emitter constantly broadcasts infrared light</text>
    <text x="30" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" fill="#cbd5e1">• Approaching object bounces light into detector</text>
    <text x="30" y="185" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" fill="#cbd5e1">• Comparator chip switches motor relay to STOP</text>
    <text x="30" y="225" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" fill="#cbd5e1">• Active buzzer chirps continuous warning tone!</text>

    <rect x="30" y="260" width="400" height="55" rx="8" fill="#0f172a" stroke="#14b8a6"/>
    <text x="230" y="295" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#2dd4bf" text-anchor="middle">CLOSED-LOOP ROBOTIC FEEDBACK</text>
  </g>

  <!-- Bottom Spec Chips -->
  <rect x="220" y="830" width="340" height="50" rx="10" fill="#020617" stroke="#334155"/>
  <text x="390" y="862" font-family="'JetBrains Mono', monospace" font-size="16" fill="#2dd4bf" text-anchor="middle">📡 OPTICAL PROXIMITY SENSOR</text>

  <rect x="590" y="830" width="360" height="50" rx="10" fill="#020617" stroke="#334155"/>
  <text x="770" y="862" font-family="'JetBrains Mono', monospace" font-size="16" fill="#22c55e" text-anchor="middle">🎯 CONCEPT: CLOSED-LOOP BRAKING</text>

  <rect x="980" y="830" width="340" height="50" rx="10" fill="#020617" stroke="#334155"/>
  <text x="1150" y="862" font-family="'JetBrains Mono', monospace" font-size="16" fill="#f59e0b" text-anchor="middle">⏱️ ESTIMATED BUILD: 35 MINS</text>

  <rect x="1350" y="830" width="350" height="50" rx="10" fill="#020617" stroke="#334155"/>
  <text x="1525" y="862" font-family="'JetBrains Mono', monospace" font-size="16" fill="#2dd4bf" text-anchor="middle">🏆 TANGIBLE: COLLISION-PROOF ROVER</text>
</svg>

