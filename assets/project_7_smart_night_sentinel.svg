<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0d1829"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  
  <!-- Technical Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1.5">
    <path d="M0,180 H1920 M0,360 H1920 M0,540 H1920 M0,720 H1920 M0,900 H1920"/>
    <path d="M240,0 V1080 M480,0 V1080 M720,0 V1080 M960,0 V1080 M1200,0 V1080 M1440,0 V1080 M1680,0 V1080"/>
  </g>

  <!-- Header Badge -->
  <rect x="120" y="90" width="380" height="48" rx="24" fill="#0369a1" opacity="0.3"/>
  <rect x="120" y="90" width="380" height="48" rx="24" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text x="310" y="122" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#38bdf8" text-anchor="middle">DAY 2 · PROJECT 7 · WITHIN-KIT</text>

  <!-- Main Title -->
  <text x="120" y="210" font-family="'Outfit', sans-serif" font-size="64" font-weight="800" fill="#ffffff">Dual-Sensor Smart Night Sentinel</text>
  <text x="120" y="260" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" fill="#94a3b8">Autonomous Anti-Intruder Sentry combining LDR Optical Dusk Sensing + Tilt Motion Alarm</text>

  <!-- Central Circuit Diagram Graphic -->
  <!-- Breadboard Base -->
  <rect x="220" y="340" width="1480" height="580" rx="24" fill="#0f172a" stroke="#1e293b" stroke-width="3"/>
  
  <!-- Tie-point pattern -->
  <g opacity="0.25" fill="#38bdf8">
    <circle cx="340" cy="460" r="4"/><circle cx="380" cy="460" r="4"/><circle cx="420" cy="460" r="4"/>
    <circle cx="340" cy="500" r="4"/><circle cx="380" cy="500" r="4"/><circle cx="420" cy="500" r="4"/>
    <circle cx="340" cy="540" r="4"/><circle cx="380" cy="540" r="4"/><circle cx="420" cy="540" r="4"/>
    <circle cx="340" cy="580" r="4"/><circle cx="380" cy="580" r="4"/><circle cx="420" cy="580" r="4"/>
  </g>

  <!-- Component 1: LDR (Light Sensor) -->
  <g transform="translate(360, 480)">
    <rect x="-80" y="-80" width="160" height="160" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="0" cy="-10" r="40" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <path d="M-25,-10 Q0,-30 25,-10 Q0,10 -25,-10" fill="none" stroke="#f59e0b" stroke-width="4"/>
    <text x="0" y="55" font-family="'Outfit', sans-serif" font-size="18" font-weight="700" fill="#fbbf24" text-anchor="middle">LDR SENSOR</text>
    <text x="0" y="115" font-family="'JetBrains Mono', monospace" font-size="14" fill="#94a3b8" text-anchor="middle">Optical Dusk Input</text>
  </g>

  <!-- Wire 1 -->
  <path d="M440, 480 L660, 480" stroke="#f59e0b" stroke-width="5" stroke-dasharray="10 5" fill="none"/>

  <!-- Component 2: Tilt Switch (Motion Sensor) -->
  <g transform="translate(760, 480)">
    <rect x="-80" y="-80" width="160" height="160" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <rect x="-24" y="-50" width="48" height="80" rx="10" fill="#0284c7"/>
    <circle cx="0" cy="0" r="14" fill="#ffffff" filter="url(#glow)"/>
    <text x="0" y="55" font-family="'Outfit', sans-serif" font-size="18" font-weight="700" fill="#38bdf8" text-anchor="middle">TILT SWITCH</text>
    <text x="0" y="115" font-family="'JetBrains Mono', monospace" font-size="14" fill="#94a3b8" text-anchor="middle">Motion / Tilt Input</text>
  </g>

  <!-- Wire 2 -->
  <path d="M840, 480 L1060, 480" stroke="#38bdf8" stroke-width="5" stroke-dasharray="10 5" fill="none"/>

  <!-- Component 3: Logic Hub / Threshold Node -->
  <g transform="translate(1160, 480)">
    <polygon points="0,-80 80,0 0,80 -80,0" fill="#1e293b" stroke="#a855f7" stroke-width="3"/>
    <text x="0" y="-8" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="800" fill="#c084fc" text-anchor="middle">AND</text>
    <text x="0" y="18" font-family="'JetBrains Mono', monospace" font-size="14" fill="#94a3b8" text-anchor="middle">LOGIC</text>
    <text x="0" y="115" font-family="'JetBrains Mono', monospace" font-size="14" fill="#94a3b8" text-anchor="middle">Compound Trigger</text>
  </g>

  <!-- Wires to Outputs -->
  <path d="M1240, 440 L1440, 400" stroke="#22c55e" stroke-width="5" fill="none"/>
  <path d="M1240, 520 L1440, 560" stroke="#ef4444" stroke-width="5" fill="none"/>

  <!-- Output 1: Active Buzzer Alarm -->
  <g transform="translate(1520, 390)">
    <circle cx="0" cy="0" r="55" fill="#0f172a" stroke="#ef4444" stroke-width="4" filter="url(#glow)"/>
    <path d="M-15,-20 L0,-20 L15,-32 L15,32 L0,20 L-15,20 Z" fill="#ef4444"/>
    <text x="0" y="75" font-family="'Outfit', sans-serif" font-size="18" font-weight="700" fill="#f87171" text-anchor="middle">ACTIVE SIREN</text>
  </g>

  <!-- Output 2: High-Intensity Alert Strobe LED -->
  <g transform="translate(1520, 570)">
    <circle cx="0" cy="0" r="50" fill="#ef4444" opacity="0.25" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="32" fill="#ef4444"/>
    <circle cx="0" cy="0" r="14" fill="#ffffff"/>
    <text x="0" y="75" font-family="'Outfit', sans-serif" font-size="18" font-weight="700" fill="#f87171" text-anchor="middle">ALERT STROBE</text>
  </g>

  <!-- Bottom Spec Chips -->
  <rect x="220" y="830" width="320" height="50" rx="10" fill="#020617" stroke="#334155"/>
  <text x="380" y="862" font-family="'JetBrains Mono', monospace" font-size="16" fill="#38bdf8" text-anchor="middle">⚡ POWER: 3V BATTERY PACK</text>

  <rect x="580" y="830" width="360" height="50" rx="10" fill="#020617" stroke="#334155"/>
  <text x="760" y="862" font-family="'JetBrains Mono', monospace" font-size="16" fill="#22c55e" text-anchor="middle">🎯 CONCEPT: MULTI-SENSOR LOGIC</text>

  <rect x="980" y="830" width="340" height="50" rx="10" fill="#020617" stroke="#334155"/>
  <text x="1150" y="862" font-family="'JetBrains Mono', monospace" font-size="16" fill="#f59e0b" text-anchor="middle">⏱️ ESTIMATED BUILD: 35 MINS</text>

  <rect x="1360" y="830" width="340" height="50" rx="10" fill="#020617" stroke="#334155"/>
  <text x="1530" y="862" font-family="'JetBrains Mono', monospace" font-size="16" fill="#c084fc" text-anchor="middle">🏆 TANGIBLE: DUAL SENTRY ALARM</text>
</svg>

