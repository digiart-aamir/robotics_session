<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="50%" stop-color="#0e1f38"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow9" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg9)"/>

  <!-- Technical Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1.5">
    <path d="M0,180 H1920 M0,360 H1920 M0,540 H1920 M0,720 H1920 M0,900 H1920"/>
    <path d="M240,0 V1080 M480,0 V1080 M720,0 V1080 M960,0 V1080 M1200,0 V1080 M1440,0 V1080 M1680,0 V1080"/>
  </g>

  <!-- Header Badge -->
  <rect x="120" y="90" width="400" height="48" rx="24" fill="#0284c7" opacity="0.3"/>
  <rect x="120" y="90" width="400" height="48" rx="24" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text x="320" y="122" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#38bdf8" text-anchor="middle">DAY 2 · PROJECT 9 · OUT-OF-KIT CHASSIS</text>

  <!-- Main Title -->
  <text x="120" y="210" font-family="'Outfit', sans-serif" font-size="64" font-weight="800" fill="#ffffff">Motorized Dual-Drive STEM Rover</text>
  <text x="120" y="260" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" fill="#cbd5e1">Wheeled Robotic Rover with Polarity-Reversing Switches, Gear Drive &amp; Steering Physics</text>

  <!-- Canvas Box -->
  <rect x="220" y="340" width="1480" height="580" rx="24" fill="#0f172a" stroke="#1e293b" stroke-width="3"/>

  <!-- Rover Blueprint Illustration -->
  <g transform="translate(680, 570)">
    <!-- Rover Chassis Plate -->
    <rect x="-260" y="-120" width="520" height="240" rx="24" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
    
    <!-- 4 Wheels -->
    <!-- Front Left Wheel -->
    <g transform="translate(-210, -170)">
      <rect x="-40" y="-30" width="80" height="60" rx="12" fill="#020617" stroke="#64748b" stroke-width="3"/>
      <path d="M-30,-20 L30,-20 M-30,0 L30,0 M-30,20 L30,20" stroke="#334155" stroke-width="4"/>
    </g>
    <!-- Front Right Wheel -->
    <g transform="translate(210, -170)">
      <rect x="-40" y="-30" width="80" height="60" rx="12" fill="#020617" stroke="#64748b" stroke-width="3"/>
      <path d="M-30,-20 L30,-20 M-30,0 L30,0 M-30,20 L30,20" stroke="#334155" stroke-width="4"/>
    </g>
    <!-- Rear Left Wheel (Driven) -->
    <g transform="translate(-210, 170)">
      <rect x="-40" y="-30" width="80" height="60" rx="12" fill="#020617" stroke="#22c55e" stroke-width="3"/>
      <path d="M-30,-20 L30,-20 M-30,0 L30,0 M-30,20 L30,20" stroke="#16a34a" stroke-width="4"/>
    </g>
    <!-- Rear Right Wheel (Driven) -->
    <g transform="translate(210, 170)">
      <rect x="-40" y="-30" width="80" height="60" rx="12" fill="#020617" stroke="#22c55e" stroke-width="3"/>
      <path d="M-30,-20 L30,-20 M-30,0 L30,0 M-30,20 L30,20" stroke="#16a34a" stroke-width="4"/>
    </g>

    <!-- Axle Lines -->
    <line x1="-210" y1="-140" x2="-210" y2="-120" stroke="#94a3b8" stroke-width="6"/>
    <line x1="210" y1="-140" x2="210" y2="-120" stroke="#94a3b8" stroke-width="6"/>
    <line x1="-210" y1="120" x2="-210" y2="140" stroke="#94a3b8" stroke-width="6"/>
    <line x1="210" y1="120" x2="210" y2="140" stroke="#94a3b8" stroke-width="6"/>

    <!-- Central DC Drive Motor -->
    <rect x="-70" y="30" width="140" height="80" rx="12" fill="#334155" stroke="#f59e0b" stroke-width="3"/>
    <text x="0" y="78" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#fbbf24" text-anchor="middle">DC MOTOR</text>

    <!-- Battery Compartment -->
    <rect x="-180" y="-90" width="160" height="90" rx="10" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
    <text x="-100" y="-38" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3V POWER</text>

    <!-- Polarity Reversing DPDT Switch -->
    <rect x="30" y="-90" width="150" height="90" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
    <circle cx="70" cy="-45" r="14" fill="#22c55e"/>
    <circle cx="140" cy="-45" r="14" fill="#334155"/>
    <text x="105" y="-15" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#86efac" text-anchor="middle">FWD / REV</text>
  </g>

  <!-- Explanatory Right Panel -->
  <g transform="translate(1220, 430)">
    <rect x="0" y="0" width="420" height="350" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="30" y="50" font-family="'Outfit', sans-serif" font-size="24" font-weight="700" fill="#38bdf8">APPLIED ROBOTICS PHYSICS</text>
    
    <text x="30" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" fill="#cbd5e1">• DC Motor torque transfer via drive axle</text>
    <text x="30" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" fill="#cbd5e1">• Mechanical polarity switch reverses spin</text>
    <text x="30" y="185" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" fill="#cbd5e1">• Independent axle steering &amp; balance</text>
    <text x="30" y="225" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" fill="#cbd5e1">• Prepares students for Arena Obstacle Race</text>

    <rect x="30" y="260" width="360" height="55" rx="8" fill="#0f172a" stroke="#38bdf8"/>
    <text x="210" y="295" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle">ROVER CHASSIS ENGINEERING</text>
  </g>

  <!-- Bottom Spec Chips -->
  <rect x="220" y="830" width="340" height="50" rx="10" fill="#020617" stroke="#334155"/>
  <text x="390" y="862" font-family="'JetBrains Mono', monospace" font-size="16" fill="#38bdf8" text-anchor="middle">🚗 WHEELED CHASSIS DRIVE</text>

  <rect x="590" y="830" width="360" height="50" rx="10" fill="#020617" stroke="#334155"/>
  <text x="770" y="862" font-family="'JetBrains Mono', monospace" font-size="16" fill="#22c55e" text-anchor="middle">🎯 CONCEPT: POLARITY &amp; TRACTION</text>

  <rect x="980" y="830" width="340" height="50" rx="10" fill="#020617" stroke="#334155"/>
  <text x="1150" y="862" font-family="'JetBrains Mono', monospace" font-size="16" fill="#f59e0b" text-anchor="middle">⏱️ ESTIMATED BUILD: 45 MINS</text>

  <rect x="1350" y="830" width="350" height="50" rx="10" fill="#020617" stroke="#334155"/>
  <text x="1525" y="862" font-family="'JetBrains Mono', monospace" font-size="16" fill="#38bdf8" text-anchor="middle">🏆 TANGIBLE: MOBILE EXPLORER</text>
</svg>

